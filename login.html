<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Raw Academy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-login">

  <!-- Barra de acessibilidade -->
  <div class="acessibilidade">
    <button id="btn-tema">Modo escuro</button>
    <button id="btn-menos">A-</button>
    <button id="btn-mais">A+</button>
  </div>

  <!-- Cartão de login -->
  <main class="cartao-login">
    <img src="Raw Logo.png" alt="Logo da Raw Academy" class="logo-grande">
    <h1>Entrar na sua conta</h1>
    <p>Site de demonstração: qualquer usuário e senha entram.</p>

    <form id="form-login">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario">

      <label for="senha">Senha</label>
      <input type="password" id="senha">

      <p id="erro-login" class="erro"></p>
      <button type="submit" class="botao">Entrar</button>
    </form>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
